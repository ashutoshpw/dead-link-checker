name: Check Schema.org

on:
  workflow_dispatch:
    inputs:
      website_url:
        description: 'Website URL to check for Schema.org structured data (e.g., https://example.com)'
        required: true
        type: string

permissions:
  contents: read
  issues: write

jobs:
  check-schema-org:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run Schema.org checker
        id: schema_org_checker
        env:
          WEBSITE_URL: ${{ github.event.inputs.website_url }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/check_schema_org.py

      - name: Check for Schema.org issues
        if: failure()
        run: |
          echo "Schema.org issues were found. An issue has been created."
          exit 1
